<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài Tập Trắc Nghiệm - Bộ Vi Xử Lý</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="styles/theme.css" />
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/quiz.css" />
        <link rel="stylesheet" href="./styles/responsive-utilities.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <!-- Theme Manager -->
        <script src="./scripts/theme-manager.js"></script>
    </head>
    <body>
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Chuyển đổi theme sáng/tối">
            <div class="toggle-icons">
                <svg
                    class="sun-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                    />
                </svg>
                <svg
                    class="moon-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </div>
        </button>

        <!-- Main Content -->
        <div id="content-section" class="content-container">
            <nav class="content-nav">
                <div class="nav-left">
                    <!-- Added wrapper for back button and title -->
                    <button id="back-to-home" class="nav-btn">◀ Về trang chủ</button>
                </div>
                <!-- Content from quiz-main-header will be moved here -->
                <div class="quiz-header-content-moved">
                    <div class="quiz-title-section">
                        <div class="quiz-icon-large">📝</div>
                        <div class="quiz-title-text">
                            <h1>Bài tập trắc nghiệm tổng hợp</h1>
                            <p>Kiểm tra và củng cố kiến thức về CPU, Bộ nhớ trong, Bộ nhớ ngoài</p>
                        </div>
                    </div>
                    <div class="quiz-stats">
                        <div class="stat-item">
                            <span class="stat-number" id="total-exercises-stat">24</span>
                            <!-- Added ID for dynamic update -->
                            <span class="stat-label">Bài tập</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">3</span>
                            <span class="stat-label">Loại</span>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Quiz Learning Container -->
            <div class="quiz-learning-container">
                <!-- New Main Layout for 2 Columns (Middle and Right) -->
                <div class="quiz-main-layout">
                    <!-- Column 1: Exercise Grid (Main content area) -->
                    <div class="quiz-column-middle">
                        <div class="exercise-types-section">
                            <div class="exercise-grid-large">
                                <!-- Theory Exercises -->
                                <div class="exercise-category" data-category="theory">
                                    <div class="exercise-list" id="theory-exercises">
                                        <!-- Theory exercises will be populated dynamically -->
                                    </div>
                                </div>

                                <!-- Thinking Exercises -->
                                <div class="exercise-category" data-category="thinking">
                                    <div class="exercise-list" id="thinking-exercises">
                                        <!-- Thinking exercises will be populated dynamically -->
                                    </div>
                                </div>

                                <!-- Visual Exercises -->
                                <div class="exercise-category" data-category="visual">
                                    <div class="exercise-list" id="visual-exercises">
                                        <!-- Visual exercises will be populated dynamically -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End of Column 1: Exercise Grid -->

                    <!-- Column 2: Filter Controls and Progress Overview -->
                    <div class="quiz-column-right">
                        <!-- Sidebar Toggle Button -->
                        <div class="progress-overview-content-wrapper">
                            <div class="exercise-types-header">
                                <h3>📝 Loại bài tập</h3>
                                <div class="exercise-filter">
                                    <button class="filter-btn active" data-filter="theory">CPU</button>
                                    <button class="filter-btn" data-filter="thinking">Bộ nhớ ngoài</button>
                                    <button class="filter-btn" data-filter="visual">Bộ nhớ trong</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End of Column 2: Filter and Progress -->
                </div>
                <!-- End of New Main Layout -->
            </div>
            <!-- End of Quiz Learning Container -->
        </div>

        <!-- Quiz Modal (reuse the existing modal structure) -->
        <div class="quiz-panel" id="quiz-panel" style="display: none">
            <div class="quiz-header">
                <div class="quiz-title">
                    <span class="quiz-icon">📝</span>
                    <span class="quiz-text">Bài tập trắc nghiệm</span>
                </div>
                <button class="quiz-close" id="quiz-close" title="Đóng">
                    <span class="close-icon">✕</span>
                </button>
            </div>
            <div class="quiz-tabs">
                <button class="quiz-tab active" data-tab="theory">
                    <span class="tab-icon">📚</span>
                    <span class="tab-text">Lý thuyết</span>
                </button>
                <button class="quiz-tab" data-tab="thinking">
                    <span class="tab-icon">🧠</span>
                    <span class="tab-text">Tư duy</span>
                </button>
                <button class="quiz-tab" data-tab="visual">
                    <span class="tab-icon">👁️</span>
                    <span class="tab-text">Hình ảnh</span>
                </button>
            </div>
            <div class="quiz-content">
                <div class="quiz-tab-content active" id="theory-content">
                    <div class="quiz-loading" id="theory-loading">
                        <div class="loading-spinner"></div>
                        <p>Đang tải bài tập lý thuyết...</p>
                    </div>
                    <iframe
                        id="theory-iframe"
                        class="quiz-iframe"
                        style="display: none"
                        title="Bài tập lý thuyết"
                    ></iframe>
                </div>
                <div class="quiz-tab-content" id="thinking-content">
                    <div class="quiz-loading" id="thinking-loading">
                        <div class="loading-spinner"></div>
                        <p>Đang tải bài tập tư duy...</p>
                    </div>
                    <iframe
                        id="thinking-iframe"
                        class="quiz-iframe"
                        style="display: none"
                        title="Bài tập tư duy"
                    ></iframe>
                </div>
                <div class="quiz-tab-content" id="visual-content">
                    <div class="quiz-loading" id="visual-loading">
                        <div class="loading-spinner"></div>
                        <p>Đang tải bài tập hình ảnh...</p>
                    </div>
                    <iframe
                        id="visual-iframe"
                        class="quiz-iframe"
                        style="display: none"
                        title="Bài tập hình ảnh"
                    ></iframe>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="scripts/quiz-manager.js"></script>
        <script src="scripts/quiz-page.js"></script>
        <script>
            // Loading screen functionality
            window.addEventListener("load", function () {
                const loadingScreen = document.getElementById("loading-screen");
                const progressRing = document.querySelector(".progress-ring-circle");
                const loadingPercentage = document.querySelector(".loading-percentage");

                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += Math.random() * 15 + 5;
                    if (progress > 100) progress = 100;

                    if (progressRing) {
                        const circumference = 2 * Math.PI * 90;
                        const offset = circumference - (progress / 100) * circumference;
                        progressRing.style.strokeDashoffset = offset;
                    }

                    if (loadingPercentage) {
                        loadingPercentage.textContent = Math.round(progress) + "%";
                    }

                    if (progress >= 100) {
                        clearInterval(progressInterval);
                        setTimeout(() => {
                            loadingScreen.style.opacity = "0";
                            setTimeout(() => {
                                loadingScreen.style.display = "none";
                            }, 500);
                        }, 500);
                    }
                }, 100);
            });

            // Back to home button
            document.getElementById("back-to-home").addEventListener("click", function () {
                window.location.href = "index.html?showVideo=true";
            });
        </script>
    </body>
</html>
