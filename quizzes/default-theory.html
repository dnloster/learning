<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài tập - Đang cập nhật</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                color: #333;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                text-align: center;
                background: white;
                border-radius: 15px;
                padding: 40px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
                max-width: 500px;
            }
            .icon {
                font-size: 4rem;
                margin-bottom: 20px;
            }
            .title {
                color: #3f51b5;
                font-size: 1.5rem;
                margin-bottom: 15px;
            }
            .message {
                color: #666;
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 20px;
            }
            .coming-soon {
                background: #e3f2fd;
                border: 2px solid #2196f3;
                border-radius: 8px;
                padding: 15px;
                color: #1976d2;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">🚧</div>
            <h1 class="title">Bài tập đang được cập nhật</h1>
            <p class="message">Bài tập cho bài học này đang trong quá trình phát triển và sẽ sớm được bổ sung.</p>
            <div class="coming-soon">📝 Sắp có bài tập tương tác thú vị!</div>
        </div>
    </body>
</html>
