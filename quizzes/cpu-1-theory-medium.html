<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Bài tập lý thuyết CPU - Mức độ trung bình</title>
        <style>
            body {
                font-family: "Roboto", sans-serif;
                color: var(--text-primary);
                background: var(--bg-primary);
                padding: 20px;
            }
            .quiz-title {
                color: #ffa726;
                margin-bottom: 20px;
            }
            .question {
                margin-bottom: 20px;
                padding: 15px;
                background: var(--bg-secondary);
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <h2 class="quiz-title">CPU - Bài tập lý thuyết (Trung bình)</h2>
        <div class="question">
            <h3>Câu 1: Cache L1 trong CPU có đặc điểm gì?</h3>
            <form>
                <input type="radio" name="q1" value="a" /> a) Dung lượng lớn nhất, tốc độ chậm nhất<br />
                <input type="radio" name="q1" value="b" /> b) Dung lượng nhỏ nhất, tốc độ nhanh nhất<br />
                <input type="radio" name="q1" value="c" /> b) Dung lượng trung bình, tốc độ trung bình<br />
                <input type="radio" name="q1" value="d" /> d) Không ảnh hưởng đến tốc độ xử lý<br />
            </form>
        </div>
    </body>
