<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài tập tư duy - Đang cập nhật</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
                min-height: 100vh;
                color: #333;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                text-align: center;
                background: white;
                border-radius: 15px;
                padding: 40px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
                max-width: 500px;
            }
            .icon {
                font-size: 4rem;
                margin-bottom: 20px;
            }
            .title {
                color: #e91e63;
                font-size: 1.5rem;
                margin-bottom: 15px;
            }
            .message {
                color: #666;
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 20px;
            }
            .coming-soon {
                background: #fff3e0;
                border: 2px solid #ff9800;
                border-radius: 8px;
                padding: 15px;
                color: #f57c00;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">🧠</div>
            <h1 class="title">Bài tập tư duy đang được cập nhật</h1>
            <p class="message">
                Bài tập phát triển tư duy cho bài học này đang trong quá trình thiết kế và sẽ sớm được hoàn thiện.
            </p>
            <div class="coming-soon">💡 Sắp có những thử thách tư duy thú vị!</div>
        </div>
    </body>
</html>
