<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Bài tập lý thuyết CPU - Mức độ dễ</title>
        <style>
            body {
                font-family: "Roboto", sans-serif;
                color: var(--text-primary);
                background: var(--bg-primary);
                padding: 20px;
            }
            .quiz-title {
                color: #4caf50;
                margin-bottom: 20px;
            }
            .question {
                margin-bottom: 20px;
                padding: 15px;
                background: var(--bg-secondary);
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <h2 class="quiz-title">CPU - Bài tập lý thuyết (Dễ)</h2>
        <div class="question">
            <h3>Câu 1: CPU là gì?</h3>
            <form>
                <input type="radio" name="q1" value="a" /> a) Central Processing Unit - Bộ xử lý trung tâm<br />
                <input type="radio" name="q1" value="b" /> b) Central Power Unit - Bộ nguồn trung tâm<br />
                <input type="radio" name="q1" value="c" /> c) Computer Processing Unit - Bộ xử lý máy tính<br />
                <input type="radio" name="q1" value="d" /> d) Control Processing Unit - Bộ xử lý điều khiển<br />
            </form>
        </div>
    </body>
</html>
