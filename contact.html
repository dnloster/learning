<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Liên hệ nhóm tác giả - Bộ Vi Xử Lý</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="styles/theme.css" />
        <link rel="stylesheet" href="styles/style.css" />
        <!-- <link rel="stylesheet" href="styles/new-styles.css" /> -->
        <link rel="stylesheet" href="./styles/responsive-utilities.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <!-- Theme Manager -->
        <script src="./scripts/theme-manager.js"></script>
        <style>
            body {
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
                min-height: 100vh;
                margin: 0;
                font-family: "Roboto", sans-serif;
                color: #fff;
            }

            .container {
                width: 95%;
                max-width: 1600px;
                margin: 30px auto;
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                border: 1px solid rgba(255, 255, 255, 0.18);
                overflow: hidden;
            }

            .content-nav {
                display: flex;
                align-items: center;
                padding: 20px;
                background: rgba(255, 255, 255, 0.1);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(5px);
                margin-bottom: 0;
            }

            .contact-content {
                padding: 40px;
            }

            .team-section h3 {
                text-align: center;
                font-size: 32px;
                color: #fff;
                margin-bottom: 50px;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            }

            .team-members {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
                gap: 40px;
                padding: 20px;
            }

            .team-member-card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(5px);
                border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                padding: 30px;
                text-align: center;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .team-member-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
                z-index: 1;
            }

            .team-member-card:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            }

            .member-avatar {
                position: relative;
                margin-bottom: 25px;
            }

            .member-avatar img {
                width: 180px;
                height: 180px;
                border-radius: 50%;
                object-fit: cover;
                border: 4px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
                transition: all 0.3s ease;
            }

            .team-member-card:hover .member-avatar img {
                transform: scale(1.05);
                border-color: rgba(255, 255, 255, 0.4);
            }

            .member-info {
                position: relative;
                z-index: 2;
            }

            .member-info h4 {
                font-size: 24px;
                color: #fff;
                margin-bottom: 10px;
                font-weight: 600;
            }

            .member-rank {
                font-size: 16px;
                color: rgba(255, 255, 255, 0.9);
                margin-bottom: 8px;
                font-weight: 500;
            }

            .member-position {
                font-size: 15px;
                color: rgba(255, 255, 255, 0.7);
                font-style: italic;
            }

            .social-links {
                display: flex;
                justify-content: center;
                gap: 15px;
                margin-top: 20px;
            }

            .social-link {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.1);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .social-link:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-3px);
            }

            @media (max-width: 768px) {
                .team-members {
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 30px;
                }

                .member-avatar img {
                    width: 150px;
                    height: 150px;
                }

                .contact-content {
                    padding: 20px;
                }
            }
        </style>
    </head>
    <body>
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Chuyển đổi theme sáng/tối">
            <svg
                class="sun-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <circle cx="12" cy="12" r="5" />
                <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                />
            </svg>
            <svg
                class="moon-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </button>

        <div class="container">
            <div class="content-container">
                <header class="container">
                    <nav class="content-nav">
                        <button id="back-to-home" class="nav-btn" onClick="goToVideoSection()">◀ Về trang chủ</button>
                        <h1>Nhóm tác giả</h1>
                    </nav>
                </header>

                <div class="contact-content">
                    <div class="team-section">
                        <div class="team-members">
                            <div class="team-member-card">
                                <div class="member-avatar">
                                    <!-- Sử dụng ảnh thật hoặc placeholder -->
                                    <img src="images/avatars/author1.jpg" alt="Nguyễn Văn A" />
                                </div>
                                <div class="member-info">
                                    <h4>Nguyễn Văn A</h4>
                                    <p class="member-rank">Tiến sĩ</p>
                                    <p class="member-position">Giảng viên chính</p>
                                </div>
                            </div>

                            <div class="team-member-card">
                                <div class="member-avatar">
                                    <img src="path/to/author1-avatar.jpg" alt="Nguyễn Văn A" />
                                </div>
                                <div class="member-info">
                                    <h4>Trần Thị B</h4>
                                    <p class="member-rank">Cấp bậc: Thạc sĩ</p>
                                    <p class="member-position">Chức vụ: Giảng viên</p>
                                </div>
                            </div>

                            <div class="team-member-card">
                                <div class="member-avatar">
                                    <img src="path/to/author1-avatar.jpg" alt="Nguyễn Văn A" />
                                </div>
                                <div class="member-info">
                                    <h4>Lê Văn C</h4>
                                    <p class="member-rank">Cấp bậc: Thạc sĩ</p>
                                    <p class="member-position">Chức vụ: Trợ giảng</p>
                                </div>
                            </div>

                            <div class="team-member-card">
                                <div class="member-avatar">
                                    <img src="path/to/author1-avatar.jpg" alt="Nguyễn Văn A" />
                                </div>
                                <div class="member-info">
                                    <h4>Phạm Thị D</h4>
                                    <p class="member-rank">Cấp bậc: Kỹ sư</p>
                                    <p class="member-position">Chức vụ: Nghiên cứu viên</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById("back-to-home").addEventListener("click", function () {
                window.location.href = "index.html?showVideo=true";
            });
        </script>
    </body>
</html>
