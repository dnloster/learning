<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Build PC</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="styles/theme.css" />
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/build-pc.css" />
        <link rel="stylesheet" href="./styles/responsive-utilities.css" />
        <!-- Theme Manager -->
        <script src="./scripts/theme-manager.js"></script>
    </head>
    <body>
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Chuyển đổi theme sáng/tối">
            <svg
                class="sun-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <circle cx="12" cy="12" r="5" />
                <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                />
            </svg>
            <svg
                class="moon-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </button>

        <header class="container">
            <nav class="content-nav">
                <button id="back-to-home" class="nav-btn" onClick="goToVideoSection()">◀ Về trang chủ</button>
                <h1>Build PC</h1>
            </nav>
        </header>

        <main>
            <div class="container">
                <div class="build-pc-layout">
                    <!-- New wrapper -->
                    <div class="component-selection-area">
                        <!-- Wrapper for the grid -->
                        <div class="component-grid" id="component-grid">
                            <!-- Components will be dynamically loaded here -->
                        </div>
                    </div>
                    <div id="selected-components" class="selected-components-summary">
                        <h3>Your Configuration:</h3>
                        <!-- Selected components will be listed here -->
                    </div>
                </div>
                <!-- End of new wrapper -->
            </div>

            <div class="modal" id="component-modal">
                <div class="modal-content">
                    <span class="close-button" id="close-modal-button">&times;</span>
                    <h3 id="modal-title">Select <span id="modal-component-name">Component</span></h3>
                    <div id="modal-item-list" class="modal-item-list">
                        <!-- Component items will be listed here -->
                    </div>
                </div>
            </div>
        </main>
        <script>
            // Hàm chuyển về phần xem video thay vì trang ban đầu
            function goToVideoSection() {
                window.location.href = "index.html?showVideo=true";
            }
        </script>
        <script src="scripts/build-pc.js"></script>
    </body>
</html>
